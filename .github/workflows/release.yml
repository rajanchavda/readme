name: Release

# Pushing a tag v<version> builds the DMG, publishes it as a GitHub release and points the
# Homebrew cask in rajanchavda/homebrew-tap at it.
#
# Needs the repository secret:
#   HOMEBREW_TAP_TOKEN   Token allowed to push to rajanchavda/homebrew-tap

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      # release.sh names the DMG and the cask after MARKETING_VERSION, so the tag has to agree.
      - name: Check the tag matches project.yml
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(sed -n 's/^[[:space:]]*MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' project.yml | head -1)
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION \"$project_version\" in project.yml."
            exit 1
          fi
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"

      # The tests run on every pull request into main (tests.yml), so a tag on main is already
      # tested and the release only builds.

      # Writes build/Readme-<version>.dmg, its .sha256 and the cask build/readme.rb.
      - name: Package
        run: scripts/release.sh

      - name: Check the release
        run: scripts/check_release.sh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/Readme-${{ env.VERSION }}.dmg
            build/Readme-${{ env.VERSION }}.dmg.sha256

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set, so the cask can't be updated."
            exit 1
          fi
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/rajanchavda/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Casks"
          cp build/readme.rb "$tap/Casks/readme.rb"

          cd "$tap"
          git add Casks/readme.rb
          git -c user.name="Readme Bot" -c user.email="readme-bot@users.noreply.github.com" \
            commit -m "Update readme to v${VERSION}" || { echo "No changes to commit"; exit 0; }
          # Another app's release may have pushed to the tap meanwhile.
          git pull --rebase
          git push
