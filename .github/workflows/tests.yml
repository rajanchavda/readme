name: Tests

# Runs only when asked, never on its own:
#   - Actions tab > Tests > "Run workflow", choosing the branch to test, or
#   - adding the label "run-tests" to a pull request (remove and add it again to rerun).
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-tests'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run tests
        env:
          SHARDS: 2
        run: scripts/test.sh
