name: Readme
options:
  bundleIdPrefix: com.rajanchavda
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # What people see as the version, and the build number that must rise with every release.
    # Readme and its updater share them.
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "7"
targets:
  Readme:
    type: application
    platform: macOS
    sources:
      - path: Readme
        excludes: ["Web/**"]
      - path: Readme/Web
        type: folder
        buildPhase: resources
      # The licences of what's bundled travel with the app.
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      # Release and install code the updater uses too, compiled here so the tests can reach it.
      - path: Shared
    # The updater lives inside the app, in Contents/Helpers.
    dependencies:
      - target: ReadmeUpdater
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajanchavda.Readme
        CODE_SIGN_ENTITLEMENTS: Readme/Readme.entitlements
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Readme
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # A shipped app mustn't let other processes attach to it, so Release leaves out the
        # debugging entitlement Xcode adds to ad-hoc builds.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    info:
      path: Readme/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: Readme Library
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.rajanchavda.Readme.library]
        # A .readmelibrary file: books and their notes, exported to take to another Mac.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.rajanchavda.Readme.library
            UTTypeDescription: Readme Library
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [readmelibrary]
  # Installs updates. It isn't sandboxed, because it has to replace Readme.app and may run brew;
  # Readme itself stays sandboxed and only starts it. It takes no instructions from Readme.
  ReadmeUpdater:
    type: application
    platform: macOS
    sources:
      - path: Updater
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajanchavda.Readme.Updater
        PRODUCT_NAME: Readme Updater
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Readme Updater
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_APP_SANDBOX: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  ReadmeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ReadmeTests
        excludes: ["Fixtures/**"]
      - path: ReadmeTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Readme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajanchavda.ReadmeTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Readme.app/Contents/MacOS/Readme"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Readme:
    build:
      targets:
        Readme: all
        ReadmeTests: [test]
    test:
      targets: [ReadmeTests]
